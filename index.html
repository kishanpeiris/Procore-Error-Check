<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetSuite ↔ Procore Error Database</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mut:#5f6773;--bd:#dde1e7;--ac:#e8590c;--code:#eef0f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#9aa3af;--bd:#2f343c;--ac:#ff8a4c;--code:#262a31}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#9aa3af;--bd:#2f343c;--ac:#ff8a4c;--code:#262a31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0}.sub{color:var(--mut);font-size:13px;margin:2px 0 12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
textarea{width:100%;min-height:52px;max-height:160px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:14px ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cnt{font-size:12px;color:var(--mut);margin:6px 2px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
summary{padding:11px 12px;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--ac);color:#fff;margin-right:6px;vertical-align:1px}
.bd{padding:0 12px 12px;font-size:14px}
.bd b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-top:8px}
.k{font:12px ui-monospace,Menlo,monospace;background:var(--code);border-radius:6px;padding:2px 6px;color:var(--mut);overflow-wrap:anywhere}
ol.steps{margin:4px 0 0;padding-left:20px}
ol.steps li{margin:3px 0}
.cp{margin-top:10px;margin-right:6px;background:none;border:1px solid var(--bd);color:var(--mut);border-radius:8px;padding:6px 12px;font-size:13px}
.cp.vendor{border-color:#0a7cff;color:#0a7cff}
.cp.internal{border-color:var(--ac);color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style></head><body><main>
<h1>🔧 NetSuite ↔ Procore Error Database</h1>
<div class="sub">Works fully offline. Search a code or paste a whole error/log — best matches rank first.</div>
<div class="bar"><textarea id="q" placeholder="Search or paste error text (e.g. INVALID_KEY_OR_REF, 422, invalid_grant)…"></textarea>
<div class="chips" id="chips"></div></div>
<div class="cnt" id="cnt"></div><div id="list"></div>
</main>

// ---- EDIT THESE TWO LINES with real addresses whenever you're ready ----
// Leave as '' to just pick the recipient yourself each time in Outlook.
const VENDOR_EMAIL = '';   // e.g. 'support@lintune.com'
const INTERNAL_EMAIL = ''; // e.g. 'ops-team@yourcompany.com'
// --------------------------------------------------------------------
const SYS={NS:'NetSuite',PC:'Procore',LT:'Lintune / Mapping',HTTP:'HTTP / Network',GEN:'General'};
let sys='ALL';
const $=id=>document.getElementById(id);
$('chips').innerHTML=[['ALL','All']].concat(Object.entries(SYS)).map(([k,v])=>`<button class="chip${k==='ALL'?' on':''}" data-k="${k}">${v}</button>`).join('');
$('chips').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sys=k;[...$('chips').children].forEach(c=>c.classList.toggle('on',c.dataset.k===k));render()};
$('q').oninput=render;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  const q=$('q').value.toLowerCase().trim();
  const toks=[...new Set(q.split(/[^a-z0-9_.\-]+/).filter(t=>t.length>2))].slice(0,60);
  let rows=D.map((r,i)=>{
    if(sys!=='ALL'&&r[0]!==sys)return null;
    let sc=0;
    if(q){
      r[2].split('|').forEach(k=>{if(k&&q.includes(k))sc+=10});
      const hay=(r[1]+' '+r[3]+' '+r[4].join(' ')).toLowerCase();
      toks.forEach(t=>{if(r[2].includes(t))sc+=3;else if(hay.includes(t))sc+=1});
      if(!sc)return null;
    }
    return {r,sc,i};
  }).filter(Boolean);
  if(q)rows.sort((a,b)=>b.sc-a.sc);
  $('cnt').textContent=rows.length+' of '+D.length+' entries'+(q?' (best match first)':'');
  $('list').innerHTML=rows.length?rows.map((x,n)=>{const r=x.r;
    return `<details${q&&n===0?' open':''}><summary><span class="tag">${r[0]}</span>${esc(r[1])}</summary><div class="bd">
    <b>Cause</b>${esc(r[3])}<b>Step-by-step fix</b><ol class="steps">${r[4].map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    <b>Matches</b><span class="k">${esc(r[2].split('|').join(' · '))}</span><br>
    <button class="cp" data-i="${x.i}" data-a="copy">Copy</button><button class="cp vendor" data-i="${x.i}" data-a="vendor">✉ Email Vendor</button><button class="cp internal" data-i="${x.i}" data-a="internal">✉ Email Internal</button></div></details>`}).join(''):'<div class="empty">No match. Try a shorter term, the HTTP status, or the error code only.</div>';
}
$('list').onclick=async e=>{const i=e.target.dataset.i;if(i===undefined)return;const r=D[i];const a=e.target.dataset.a;
  const t=`[${SYS[r[0]]}] ${r[1]}\nCause: ${r[3]}\nFix:\n`+r[4].map((s,n)=>`${n+1}. ${s}`).join('\n');
  if(a==='copy'){
    try{await navigator.clipboard.writeText(t);e.target.textContent='Copied ✓'}catch(_){e.target.textContent='Copy blocked'}
  }else if(a==='vendor'||a==='internal'){
    const to=a==='vendor'?VENDOR_EMAIL:INTERNAL_EMAIL;
    const subject=`[${SYS[r[0]]}] ${r[1]}`;
    const body=(linkedErr?`Original error:\n${linkedErr}\n\n`:'')+`Cause: ${r[3]}\n\nFix steps:\n`+r[4].map((s,n)=>`${n+1}. ${s}`).join('\n');
    window.location.href=`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }};
// ---- Open from a link: page.html#e=<url-encoded error text> ----
// Text after the # stays in the browser and is never sent to the server.
let linkedErr='';
function loadFromHash(){
  const m=location.hash.match(/^#e=(.*)$/s);
  if(!m)return;
  try{linkedErr=decodeURIComponent(m[1].replace(/\+/g,' '))}catch(_){linkedErr=m[1]}
  $('q').value=linkedErr;render();
}
window.addEventListener('hashchange',loadFromHash);
render();loadFromHash();
</script></body></html>
